name: CI/CD tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend test image
        run: docker build -f backend/Dockerfile.test -t turmemeal-backend-test backend

      - name: Run backend tests
        run: docker run --rm turmemeal-backend-test

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Run PostgreSQL integration tests
        run: docker compose --profile test run --rm test pytest -m integration

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend test image
        run: docker build -f frontend/Dockerfile.test -t turmemeal-frontend-test frontend

      - name: Run frontend tests
        run: docker run --rm turmemeal-frontend-test

      - name: Lint frontend
        run: docker run --rm turmemeal-frontend-test npm run lint

      - name: Build frontend
        run: docker run --rm turmemeal-frontend-test npm run build
